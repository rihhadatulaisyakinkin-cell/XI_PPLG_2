
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav {
            display: flex;
            width: 100%;
            height: 3rem;
            background-color: rgb(16, 207, 207);
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .nav ul {
            list-style: none;
            display: flex;
            gap: 3rem;
        }

        .text-center {
            text-align: center;
        }

        .mt {
            margin-top: 5rem;
        }

        .mb {
            margin-bottom: 3rem;
        }

        .container {
            display: flex;
            justify-content: space-evenly;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .card {
            min-height: 15rem;
            width: 10rem;
            padding: 1rem;
            background-color: rgb(70, 169, 214);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="nav">
        <h1>Portofolio</h1>

        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Project</li>
        </ul>
    </div>

    <section>
        <h1 class="text-center mt mb">projek</h1>
    </section>

    <div class="container">
        <div class="card">
            <h3>Project 1</h3>
            <p>Website pertama saya.</p>
        </div>

        <div class="card">
            <h3>Project 2</h3>
            <p>Website kedua saya.</p>
        </div>

        <div class="card">
            <h3>Project 3</h3>
            <p>Website ketiga saya.</p>
        </div>
    </div>
</body>
</html>
